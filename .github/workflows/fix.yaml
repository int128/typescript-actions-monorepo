name: fix

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.json'
      - pnpm-*
      - .github/workflows/fix.yaml
  push:
    branches:
      - main
    paths:
      - '**/*.ts'
      - '**/*.json'
      - pnpm-*
      - .github/workflows/fix.yaml

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm i
      - run: pnpm run -r check
      - uses: int128/update-generated-files-action@1486b210d2f982ac40d27ef55660863b006722b0 # v2.115.0
