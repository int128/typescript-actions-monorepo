name: fix

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.json'
      - pnpm-*
      - .github/workflows/fix.yaml
  push:
    branches:
      - main
    paths:
      - '**/*.ts'
      - '**/*.json'
      - pnpm-*
      - .github/workflows/fix.yaml

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm i
      - run: pnpm run -r check
      - uses: int128/update-generated-files-action@ffeee0fc8e9dc4718c1f36be68b9d89b2be28e51 # v2.109.0
